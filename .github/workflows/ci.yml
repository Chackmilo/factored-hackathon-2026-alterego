name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alterego
          POSTGRES_PASSWORD: alterego
          POSTGRES_DB: alterego_ops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alterego"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Lint the files the dispute stack owns
        run: uvx ruff check src/rules/dispute_policy.py src/ops src/understand src/orchestrator src/auth src/api/dispute_routes.py src/eval tests/test_dispute_policy.py tests/test_dispute_orchestrator.py tests/test_dispute_api.py tests/test_ops_store.py tests/test_session_verifier.py tests/test_eval_harness.py tests/test_heldout_suite.py tests/test_labeling.py tests/test_keyword_extractor.py src/rag tests/test_policy_rag.py tests/test_rag_benchmark.py
      - name: Tests (ops round trip on the Postgres service, data-integrity tests need the lakehouse and are deselected)
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql://alterego:alterego@localhost:5432/alterego_ops_test
        run: uv run pytest -q --deselect tests/test_data_integrity.py
      - name: Evaluation report on the development split
        run: PYTHONPATH=. uv run python -m src.eval.run data/eval/dev_cases.jsonl --out reports/eval_dev --repeats 1
      - uses: actions/upload-artifact@v4
        with:
          name: eval-dev-report
          path: reports/eval_dev.*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
