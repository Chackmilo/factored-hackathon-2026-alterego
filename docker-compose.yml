services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniguard-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # lakehouse (built from S3) and the ops store
    environment:
      - APP_ENV=development   # the local ES256 issuer stays on; production needs SUPABASE_URL and Supabase Auth
      - DEBUG=False
      - APP_PORT=8000
      - LLM_PROVIDER=mock
      - LAKEHOUSE_PATH=data/lakehouse.duckdb
      - OPS_DB_PATH=data/ops.duckdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Development and tests on Linux, identical on Mac and Windows: `docker compose run --rm dev` runs the suite as CI does.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    volumes:
      - .:/app                               # live source; the virtualenv stays in the image at /opt/venv
      - duckdb-extensions:/root/.duckdb      # httpfs is downloaded once, not on every run
    environment:
      - APP_ENV=test
      - TEST_DATABASE_URL=postgresql://alterego:alterego@db:5432/alterego_ops_test
    depends_on:
      db:
        condition: service_healthy
    command: pytest -q --deselect tests/test_data_integrity.py

  # The Postgres of the CI job, for the ops store, gateway and publish tests. Data lives in memory only.
  db:
    profiles: ["dev"]
    image: postgres:17
    environment:
      - POSTGRES_USER=alterego
      - POSTGRES_PASSWORD=alterego
      - POSTGRES_DB=alterego_ops_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "alterego"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  duckdb-extensions:
