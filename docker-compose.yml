version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniguard-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - APP_PORT=8000
      - LLM_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
