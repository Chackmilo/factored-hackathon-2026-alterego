[project]
name = "hackaton"
version = "0.1.0"
description = "AlterEgo / OmniGuard AI - AI-First Banking Dispute Intake Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.15",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "typesafe-sdk==0.7.1",
    "uvicorn>=0.53.0",
]

# Tests, notebooks, scripts and training. `uv sync` installs this group by default; `uv sync --no-dev`, which the
# production image and Vercel's build run, leaves it out (tests/test_runtime_dependencies.py keeps the API off it).
[dependency-groups]
dev = [
    "alembic>=1.13",
    "boto3>=1.43.103",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "onnxruntime>=1.30.0",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0",
    "tokenizers>=0.23.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]

# Vercel (docs/SUPABASE_VERCEL.md section 6). The root main.py is the baseline demo, so the API is named here; the build
# step compiles the React front that the app mounts at "/", and vercel.json trims the function bundle.
[tool.vercel]
entrypoint = "src.api.app:app"

[tool.vercel.scripts]
build = "python scripts/deploy/vercel_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # APP_ENV is set before src is imported
